[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "epi13-local-harness"
version = "0.4.2"
description = "A local, policy-aware AI harness that routes tasks across local models and verifies tool-driven work."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Alexander Collamore" }]
keywords = ["ollama", "local-ai", "agents", "tool-calling", "tui", "routing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
]
dependencies = ["textual>=8.2,<9"]

[project.optional-dependencies]
fabric = ["mncs-fabric>=0.2.0a8,<0.3"]
router = [
  "torch>=2.4",
  "transformers>=5.1,<6",
  "huggingface-hub>=0.34",
]
dev = ["pytest>=8.0", "ruff>=0.9"]

[project.scripts]
epi13-harness = "epi13_local_harness.cli:main"
elh = "epi13_local_harness.cli:main"
elh-tui = "epi13_local_harness.tui:main"
elh-fabric = "epi13_local_harness.fabric_profile:main"

[project.urls]
Repository = "https://github.com/epi13/epi13-local-harness"
Issues = "https://github.com/epi13/epi13-local-harness/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/epi13_local_harness"]

[tool.hatch.build]
include = [
  "src/epi13_local_harness/**/*.py",
  "src/epi13_local_harness/default_config.toml",
  "src/epi13_local_harness/default_evals.jsonl",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
