[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "mncs-harness"
version = "0.6.7"
description = "MNCS Harness: a policy-aware operator harness that routes tasks across configured models and verifies tool-driven work."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "MNCS Contributors" }, { name = "Alexander Collamore" }]
keywords = ["mncs", "ollama", "local-ai", "agents", "tool-calling", "tui", "routing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
]
dependencies = ["packaging>=24,<26", "textual>=8.2,<9"]

[project.optional-dependencies]
fabric = ["mncs-fabric>=0.2.0a17,<0.3"]
commons = ["mncs-commons[mcp]>=0.5.0.dev1,<0.6"]
distributed = [
  "mncs-fabric>=0.2.0a17,<0.3",
  "mncs-commons[mcp]>=0.5.0.dev1,<0.6",
]
dev = ["pytest>=8.0", "ruff>=0.9"]

[project.scripts]
mncs-harness = "epi13_local_harness.cli:main"
mncs-harness-tui = "epi13_local_harness.tui:main"
mncs-harness-fabric = "epi13_local_harness.fabric_controller_light:main"
epi13-harness = "epi13_local_harness.cli:main"
elh = "epi13_local_harness.cli:main"
elh-tui = "epi13_local_harness.tui:main"
elh-fabric = "epi13_local_harness.fabric_controller_light:main"

[project.urls]
Homepage = "https://github.com/epi13/mncs-harness"
Repository = "https://github.com/epi13/mncs-harness"
Issues = "https://github.com/epi13/mncs-harness/issues"
Atlas = "https://github.com/epi13/mncs-atlas"

[tool.hatch.build.targets.wheel]
packages = ["src/epi13_local_harness", "src/mncs_harness"]

[tool.hatch.build]
include = [
  "src/epi13_local_harness/**/*.py",
  "src/epi13_local_harness/default_config.toml",
  "src/epi13_local_harness/default_evals.jsonl",
  "src/mncs_harness/**/*.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
