[ollama]
base_url = "http://127.0.0.1:11434"
timeout_seconds = 600
max_tool_steps = 8

[models.e2b]
name = "gemma4:e2b"
provider = "fabric"
keep_alive = "10m"
num_ctx = 8192
think = false
temperature = 1.0
top_p = 0.95
top_k = 64
tools = ["read_file", "list_directory", "search_text", "git_diff", "system_info"]

[models.e4b]
name = "gemma4:e4b"
provider = "fabric"
keep_alive = "10m"
num_ctx = 12288
think = true
temperature = 1.0
top_p = 0.95
top_k = 64
tools = ["read_file", "list_directory", "search_text", "write_file", "run_command", "git_diff", "system_info"]

[models.coder]
name = "qwen3:8b"
provider = "fabric"
keep_alive = "0"
num_ctx = 12288
think = true
temperature = 0.4
top_p = 0.9
top_k = 40
tools = ["read_file", "list_directory", "search_text", "write_file", "run_command", "git_diff", "system_info"]

[models.reviewer]
name = "gemma4:12b"
provider = "fabric"
keep_alive = "0"
num_ctx = 16384
think = true
temperature = 1.0
top_p = 0.95
top_k = 64
tools = ["read_file", "list_directory", "search_text", "write_file", "run_command", "git_diff", "system_info"]

[router]
mode = "hybrid"
backend = "transformers"
model = "LiquidAI/LFM2.5-Encoder-350M-Prompt-Router"
revision = "35ca4a0469f180f1cf05a630df8842fa17ac18e3"
device = "cpu"
minimum_score = 0.60
minimum_margin = 0.12
enable_semantic_routing = false
fallback = "deterministic"
ambiguity_lane = "review"
cache_directory = "~/.cache/huggingface/hub"
local_files_only = false

[lanes.chat]
description = "Simple explanatory or conversational work"
worker_role = "e2b"
enabled = true
requires_image = false

[lanes.coding]
description = "Code and patch work"
worker_role = "coder"
enabled = true
requires_image = false
escalation = ["review"]

[lanes.review]
description = "High-risk or high-complexity review"
worker_role = "reviewer"
enabled = true
requires_image = false

[lanes.ocr]
description = "OCR, screenshots, scanned documents, tables, and text extraction"
worker_role = "reviewer"
enabled = true
requires_image = true
escalation = ["review"]

[routing]
code_specialist_enabled = true
escalate_on_verifier_failure = true
escalate_on_tool_error = true
max_attempts = 3
simple_word_limit = 80
complex_word_limit = 220
semantic_enabled = false
semantic_backend = "transformers"
semantic_model = "LiquidAI/LFM2.5-Encoder-350M-Prompt-Router"
semantic_revision = "35ca4a0469f180f1cf05a630df8842fa17ac18e3"
semantic_device = "cpu"
minimum_score = 0.60
minimum_margin = 0.12
fallback = "deterministic"
ambiguity_lane = "review"

[policy]
approval_mode = "prompt"
max_file_bytes = 1048576
max_tool_output_chars = 16000
command_timeout_seconds = 120
allow_hidden_paths = false
allowed_executables = [
  "bash", "sh", "python", "python3", "pytest", "ruff", "mypy", "shellcheck",
  "git", "cargo", "gcc", "clang", "cmake", "make", "ninja",
  "cat", "head", "tail", "grep", "rg", "find", "ls", "pwd", "wc", "stat",
  "file", "jq", "uname", "free", "df", "du", "inxi"
]

[verification]
run_unit_tests = false
unit_test_command = ["python", "-m", "unittest", "discover", "-s", "tests"]
use_shellcheck_when_available = true

[metrics]
path = "~/.local/state/epi13-local-harness/metrics.sqlite3"
store_prompt_text = false

[commons]
enabled = false
store_path = "~/.local/state/mncs-commons"
domain = "local"
auto_initialize = true
allow_model_publication = false
publish_fabric_evidence = false
startup_timeout_seconds = 10.0
call_timeout_seconds = 30.0
max_response_bytes = 1048576

[controller]
generation_policy = "local-generation-allowed"

[model_residency]
enabled = false
warm_on_startup = false
prefer_resident_for_auto_routing = true
keep_alive = -1
warm_timeout_seconds = 300.0
maximum_model_memory_fraction = 0.5
role_preference = ["e4b", "e2b", "coder", "reviewer"]

[fabric]
enabled = false
controller_id = "epi13-local-harness"
# registry_path = "~/.local/state/mncs-fabric/workers.json"
state_path = "~/.local/state/epi13-local-harness/fabric.jsonl"
fallback_to_local = true
refresh_on_startup = true
refresh_timeout_seconds = 5.0
runtime_probe_on_refresh = true
runtime_probe_timeout_seconds = 45.0
runtime_probe_max_age_seconds = 1800.0
worker_bundle_root = "~/.local/state/epi13-local-harness/fabric-worker-bundle"
provider_ollama_base_url = "http://127.0.0.1:11434"
provider_timeout_seconds = 600
job_timeout_overhead_seconds = 5

# Add explicit [fabric.workers.<id>] tables for enrolled workers. Remote
# certificate/key/trust paths are intentionally operator-provided and are not
# populated in this bundled configuration.
