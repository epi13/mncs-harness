name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Checkout experiment-certified MNCS Fabric
        uses: actions/checkout@v4
        with:
          repository: epi13/mncs-fabric
          # EXPERIMENT_CERTIFIED_FABRIC 0.2.0a30 — exact certified revision
          ref: 02fea5b5571e3b43a532d904f56468f99c75e482
          path: .dependencies/mncs-fabric
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -e .dependencies/mncs-fabric
          python -m pip install -e '.[dev]'
      - name: Provision pinned MNCS executor
        # Product paths execute real MNCS and fail closed without an
        # executor. Fetch the digest-verified release build (explicit,
        # pinned in docs/MNCS_TOOLCHAIN.md) and bind it via MNCS_EXECUTOR.
        # The transitional Python fallback is removed; this step is what
        # keeps the normal suite on the canonical runtime.
        run: |
          python scripts/fetch_mncs_executor.py --dest '${{ runner.temp }}/mncs-bin/mncs-executor'
          echo "MNCS_EXECUTOR=${{ runner.temp }}/mncs-bin/mncs-executor" >> "$GITHUB_ENV"
      - name: Ruff
        run: ruff check src tests scripts
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Enforcement boundary
        run: python -m pytest tests/test_atlas_binding.py tests/test_atlas_enforcement.py -q -p no:cacheprovider
      - name: Routing evaluations
        run: elh eval

  mncs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned MNCS toolchain
        uses: actions/checkout@v4
        with:
          # MNCS toolchain pin — FULL immutable SHA, must match
          # docs/MNCS_TOOLCHAIN.md. A short SHA fails: checkout resolves
          # `ref` as a branch/tag name first (prior red main, run 34076065814).
          repository: epi13/mncs-language
          ref: 8d79250d54d4e4241c0bb0ae6f5c632345848a6d
          path: .dependencies/mncs-language
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Checkout experiment-certified MNCS Fabric
        uses: actions/checkout@v4
        with:
          repository: epi13/mncs-fabric
          ref: 02fea5b5571e3b43a532d904f56468f99c75e482
          path: .dependencies/mncs-fabric
      - name: Install
        run: |
          python -m pip install -e .dependencies/mncs-fabric
          python -m pip install -e '.[dev]'
      - name: Build MNCS executor
        run: cargo build -p mncs-cli
        working-directory: .dependencies/mncs-language
      - name: Ruff
        run: ruff check src tests scripts
      - name: Toolchain identity gate
        run: python scripts/check_toolchain_identity.py
      - name: Artifact drift gate
        run: python scripts/build_mncs_artifacts.py --verify
        env:
          MNCS_EXECUTOR: ${{ github.workspace }}/.dependencies/mncs-language/target/debug/mncs
      - name: Conversion ledger gate
        run: python scripts/check_conversion_ledger.py
      - name: Real MNCS execution tests
        run: python -m pytest tests/test_mncs_exec.py tests/test_mncs_logic.py -q -p no:cacheprovider
        env:
          MNCS_EXECUTOR: ${{ github.workspace }}/.dependencies/mncs-language/target/debug/mncs
      - name: Installed-package smoke test
        run: |
          python -m venv /tmp/mncs-smoke-venv
          /tmp/mncs-smoke-venv/bin/pip install -q .
          /tmp/mncs-smoke-venv/bin/python scripts/fetch_mncs_executor.py --dest /tmp/mncs-smoke-executor
          MNCS_EXECUTOR=/tmp/mncs-smoke-executor /tmp/mncs-smoke-venv/bin/mncs-harness route "Repair the Python tests in this repository"
          MNCS_EXECUTOR=/tmp/mncs-smoke-executor /tmp/mncs-smoke-venv/bin/mncs-harness eval
          MNCS_EXECUTOR=/tmp/mncs-smoke-executor /tmp/mncs-smoke-venv/bin/python -c "from mncs_harness import mncs_exec; print(mncs_exec.primary_role(True, False, True, False, False, False))"

  fabric-min-supported:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout minimum-supported MNCS Fabric
        uses: actions/checkout@v4
        with:
          repository: epi13/mncs-fabric
          # MIN_SUPPORTED_FABRIC 0.2.0a17 — compatibility floor, not the experiment pin
          ref: 6285f7d3f49994e926aa0468a6cc2b644f9a3e85
          path: .dependencies/mncs-fabric
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install minimum-supported Fabric
        run: |
          python -m pip install -e .dependencies/mncs-fabric
          python -m pip install -e '.[dev]'
      - name: Provision pinned MNCS executor
        run: |
          python scripts/fetch_mncs_executor.py --dest '${{ runner.temp }}/mncs-bin/mncs-executor'
          echo "MNCS_EXECUTOR=${{ runner.temp }}/mncs-bin/mncs-executor" >> "$GITHUB_ENV"
      - name: Minimum-supported Fabric integration
        run: python -m unittest tests.test_persistent_fabric tests.test_fabric -v

  fabric-main-canary:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Checkout MNCS Fabric main
        uses: actions/checkout@v4
        with:
          repository: epi13/mncs-fabric
          # FABRIC_MAIN_CANARY — forward compatibility only; not experiment provenance
          ref: main
          path: .dependencies/mncs-fabric
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install canary dependencies
        run: |
          python -m pip install -e .dependencies/mncs-fabric
          python -m pip install -e '.[dev]'
      - name: Provision pinned MNCS executor
        run: |
          python scripts/fetch_mncs_executor.py --dest '${{ runner.temp }}/mncs-bin/mncs-executor'
          echo "MNCS_EXECUTOR=${{ runner.temp }}/mncs-bin/mncs-executor" >> "$GITHUB_ENV"
      - name: Fabric-main integration tests
        run: python -m unittest tests.test_persistent_fabric -v
