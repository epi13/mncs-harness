name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Checkout MNCS Fabric main
        uses: actions/checkout@v4
        with:
          repository: epi13/mncs-fabric
          ref: main
          path: .dependencies/mncs-fabric
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -e .dependencies/mncs-fabric
          python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Routing evaluations
        run: elh eval
